# Serves the built React SPA and proxies backend API paths to the
# "app" (FastAPI) container over the docker-compose network. Both the
# frontend and backend are reached through this single origin on port
# 80 — the browser never talks to the backend container directly, which
# is why CORS isn't a concern here (VITE_API_BASE_URL is left empty).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend routes — see backend/app/routes/__init__.py and main.py:
    # every API route is under /api/* or /auth/*, plus /health at the root.
    #
    # proxy_read_timeout raised well above nginx's 60s default: POST
    # .../messages can chain multiple sequential LLM calls in one request
    # (Agent 1 draft, then Agent 2 Stage A + Stage B judge, each with up
    # to 4 retry attempts — see app/ai/judge/service.py._call_llm_json and
    # app/services/ai_integration.py) and can legitimately take longer
    # than 60s under model latency/fallback/retry, which would otherwise
    # surface to the user as a 504 while the backend is still working.
    location /api/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /auth/ {
        proxy_pass http://app:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://app:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # SPA fallback — React Router handles client-side routing, so any
    # path that isn't a real static file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived caching for hashed static assets (Vite fingerprints
    # filenames on build, so cache invalidation is automatic).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
