name: brdagent

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: brdagent
      POSTGRES_PASSWORD: brdagent
      POSTGRES_DB: brdagent
    ports:
      - "5432:5432"
    volumes:
      - brdagent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brdagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    volumes:
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      DATABASE_URL: postgresql+asyncpg://brdagent:brdagent@postgres:5432/brdagent
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Host-reachable URL — this is called from the browser on the host,
      # not from inside the docker network, so it must stay 127.0.0.1:8000,
      # not http://app:8000 (which only resolves between containers).
      # 127.0.0.1, not "localhost" — on this stack (Docker Desktop + WSL2 on
      # Windows), "localhost" resolves to ::1 first, which WSL2's own
      # wslrelay.exe is separately squatting on, causing ERR_CONNECTION_RESET
      # even though Docker's own proxy is correctly listening on 0.0.0.0.
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules # anonymous-ish named volume so the
                                                  # container's own Linux node_modules
                                                  # isn't shadowed by the host's bind mount
    depends_on:
      app:
        condition: service_healthy

volumes:
  brdagent_pgdata:
  frontend_node_modules:
