name: CI/CD

on:
  push:
    branches: [production, development]
  pull_request:
    branches: [production, development]

env:
  REGISTRY: ghcr.io
  # Hardcoded lowercase — GHCR rejects uppercase in image paths, and
  # ${{ github.repository_owner }} resolves to "VeironVaya" (mixed
  # case), which would break the push. Must match docker-compose.prod.yml.
  BACKEND_IMAGE: ghcr.io/veironvaya/brd-agent-v2-backend
  FRONTEND_IMAGE: ghcr.io/veironvaya/brd-agent-v2-frontend

jobs:
  # ---------------------------------------------------------------------
  # Runs on every push/PR to production or development — backend
  # integration tests against a real Postgres service container (matches
  # backend/tests/conftest.py's expectations: real HTTP client, real DB,
  # no mocks). Never deploys.
  # ---------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brdagent
          POSTGRES_PASSWORD: brdagent
          POSTGRES_DB: brdagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brdagent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Run backend tests
        working-directory: backend
        env:
          # test/CI-only credentials against the ephemeral service
          # container above — never used outside this workflow run.
          JWT_SECRET: test-secret-at-least-32-bytes-long-for-hs256
          TEST_LIVE_GROQ_KEY: ""
          TEST_LIVE_GEMINI_KEY: ""
        run: pytest -q

  # ---------------------------------------------------------------------
  # Only runs on push to production (the deploy branch — separate from
  # GitHub's default branch) — builds both production images, pushes
  # them to GHCR, then SSHes into the EC2 instance to pull the new images
  # and restart the stack.
  # ---------------------------------------------------------------------
  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail
            cd /opt/brd-agent-v2
            export IMAGE_TAG=${{ github.sha }}
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${{ github.sha }}/" .env.prod
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
            docker image prune -f
